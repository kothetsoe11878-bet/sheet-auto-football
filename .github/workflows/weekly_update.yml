name: Weekly Football Excel Auto-Update

on:
  schedule:
    # Runs every Wednesday at 11:00 AM Myanmar Time (04:30 UTC)
    - cron: '30 4 * * 3'
  workflow_dispatch: # Allows manual trigger from Actions tab anytime

jobs:
  update-excel-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl

      - name: Run Python Update Script
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python update_sheet.py

      - name: Commit and Push Changes back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.xlsx
          git commit -m "Auto-update football Excel files via GitHub Actions [skip ci]" || exit 0
          git push
