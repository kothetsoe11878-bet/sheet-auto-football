name: Update Football Results & Odds

on:
  schedule:
    - cron: '0 6 * * *' # နေ့စဉ် မြန်မာစံတော်ချိန် မနက်ပိုင်းတွင် အလိုအလျောက် Update လုပ်မည်
  workflow_dispatch: # လက်ဖြင့် ခလုတ်နှိပ်၍လည်း Run နိုင်သည်

jobs:
  update-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas gspread google-auth openpyxl requests

      - name: Run Update Script
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python update_sheet.py
